<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Lista de tareas con prioridades, vencimientos y etiquetas. Se guarda en tu navegador." />
    <title>Tareas</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fbfbf9'/%3E%3Cpath d='M0 10.5h32M0 21.5h32' stroke='%23c9dcef' stroke-width='1.5'/%3E%3Cpath d='M6 17l6.5 6.5L26 8' fill='none' stroke='%232a3fd6' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preload" href="fonts/recursive-latin-casl-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="sheet">
      <header class="masthead">
        <h1>
          <span class="sr-only">Tareas del </span>
          <time id="today"></time>
        </h1>
        <p id="counter" class="counter" aria-live="polite"></p>
      </header>

      <form id="todo-form" class="todo-form">
        <div class="row">
          <label for="new-todo" class="sr-only">Nueva tarea</label>
          <input
            id="new-todo"
            type="text"
            placeholder="Escribí una tarea"
            autocomplete="off"
            maxlength="200"
            required
          />
          <button type="submit">Agregar</button>
        </div>
        <div class="options">
          <label>
            Vence
            <input id="new-due" type="date" />
          </label>
          <label>
            Prioridad
            <select id="new-priority">
              <option value="high">Alta</option>
              <option value="medium" selected>Media</option>
              <option value="low">Baja</option>
            </select>
          </label>
        </div>
      </form>

      <input
        id="search"
        class="search"
        type="search"
        placeholder="Buscar tareas o #etiquetas"
        aria-label="Buscar tareas"
        autocomplete="off"
      />
      <div id="tags" class="tags" role="group" aria-label="Filtrar por etiqueta" hidden></div>

      <div class="toolbar">
        <nav class="filters" aria-label="Filtrar tareas">
          <button type="button" data-filter="all">Todas</button>
          <button type="button" data-filter="active">Pendientes</button>
          <button type="button" data-filter="completed">Completadas</button>
        </nav>
        <label class="sort">
          Ordenar por
          <select id="sort">
            <option value="added">Orden de carga</option>
            <option value="priority">Prioridad</option>
            <option value="due">Vencimiento</option>
            <option value="newest">Más nuevas</option>
          </select>
        </label>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty" class="empty" hidden></p>

      <footer class="footer">
        <button id="clear-completed" type="button" class="link-button">
          Eliminar completadas
        </button>
      </footer>

      <p class="hint">Doble clic en una tarea para editarla. Sumá #etiquetas dentro del texto para agruparlas.</p>
    </main>

    <div id="toast" class="toast" role="status" hidden>
      <span id="toast-message"></span>
      <button id="toast-undo" type="button">Deshacer</button>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
