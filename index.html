<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Lista de tareas con filtros, prioridades y persistencia en localStorage." />
    <title>Lista de tareas</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%85%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Mis tareas</h1>

      <form id="todo-form" class="todo-form">
        <div class="row">
          <label for="new-todo" class="sr-only">Nueva tarea</label>
          <input
            id="new-todo"
            type="text"
            placeholder="¿Qué tenés que hacer? Podés usar #etiquetas"
            autocomplete="off"
            maxlength="200"
            required
          />
          <button type="submit">Agregar</button>
        </div>
        <div class="row options">
          <label>
            Vence
            <input id="new-due" type="date" />
          </label>
          <label>
            Prioridad
            <select id="new-priority">
              <option value="high">Alta</option>
              <option value="medium" selected>Media</option>
              <option value="low">Baja</option>
            </select>
          </label>
        </div>
      </form>

      <input
        id="search"
        class="search"
        type="search"
        placeholder="Buscar tareas o #etiquetas"
        aria-label="Buscar tareas"
        autocomplete="off"
      />
      <div id="tags" class="tags" role="group" aria-label="Filtrar por etiqueta" hidden></div>

      <div class="toolbar">
        <nav class="filters" aria-label="Filtrar tareas">
          <button type="button" data-filter="all">Todas</button>
          <button type="button" data-filter="active">Pendientes</button>
          <button type="button" data-filter="completed">Completadas</button>
        </nav>
        <label class="sort">
          Ordenar
          <select id="sort">
            <option value="added">Orden de carga</option>
            <option value="priority">Prioridad</option>
            <option value="due">Vencimiento</option>
            <option value="newest">Más nuevas</option>
          </select>
        </label>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty" class="empty" hidden></p>

      <footer class="footer">
        <span id="counter" aria-live="polite"></span>
        <button id="clear-completed" type="button" class="link-button">
          Borrar completadas
        </button>
      </footer>

      <p class="hint">Doble clic sobre una tarea para editarla.</p>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
