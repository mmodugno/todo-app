<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Lista de tareas con prioridades, vencimientos y etiquetas. Se guarda en tu navegador." />
    <title>Tareas</title>
    <meta name="theme-color" content="#fbfbf9" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fbfbf9'/%3E%3Cpath d='M0 10.5h32M0 21.5h32' stroke='%23c9dcef' stroke-width='1.5'/%3E%3Cpath d='M6 17l6.5 6.5L26 8' fill='none' stroke='%232a3fd6' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preload" href="fonts/recursive-latin-casl-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Aplica el tema antes de pintar para que no haya un destello del tema equivocado.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('todo-app:theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#10143a' : '#fbfbf9';
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button id="theme-toggle" class="theme-toggle" type="button">
      <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
      </svg>
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
      <span class="to-dark">Modo oscuro</span>
      <span class="to-light">Modo claro</span>
    </button>

    <main class="sheet">
      <header class="masthead">
        <h1>
          <span class="sr-only">Tareas del </span>
          <time id="today"></time>
        </h1>
        <p id="counter" class="counter" aria-live="polite"></p>
      </header>

      <form id="todo-form" class="todo-form">
        <div class="row">
          <label for="new-todo" class="sr-only">Nueva tarea</label>
          <input
            id="new-todo"
            type="text"
            placeholder="Nueva tarea"
            autocomplete="off"
            maxlength="200"
            required
          />
          <button type="submit">Agregar</button>
        </div>
        <div class="quick" role="group" aria-label="Atajos de fecha y prioridad">
          <button type="button" data-due="today">Hoy</button>
          <button type="button" data-due="tomorrow">Mañana</button>
          <button type="button" data-due="nextweek">+1 semana</button>
          <button type="button" id="quick-priority">Prioridad media</button>
        </div>
        <div class="options">
          <label>
            Vence
            <input id="new-due" type="date" />
          </label>
          <label>
            Prioridad
            <select id="new-priority">
              <option value="high">Alta</option>
              <option value="medium" selected>Media</option>
              <option value="low">Baja</option>
            </select>
          </label>
        </div>
      </form>

      <input
        id="search"
        class="search"
        type="search"
        placeholder="Buscar tareas o #etiquetas"
        aria-label="Buscar tareas"
        autocomplete="off"
      />
      <div id="tags" class="tags" role="group" aria-label="Filtrar por etiqueta" hidden></div>

      <div class="toolbar">
        <nav class="filters" aria-label="Filtrar tareas">
          <button type="button" data-filter="all">Todas</button>
          <button type="button" data-filter="active">Pendientes</button>
          <button type="button" data-filter="completed">Completadas</button>
        </nav>
        <label class="sort">
          Ordenar por
          <select id="sort">
            <option value="added">Orden de carga</option>
            <option value="priority">Prioridad</option>
            <option value="due">Vencimiento</option>
            <option value="newest">Más nuevas</option>
          </select>
        </label>
        <div class="toolbar-actions">
          <button
            type="button"
            id="search-toggle"
            class="icon-button"
            aria-label="Buscar"
            aria-expanded="false"
            aria-controls="search"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" />
              <path d="M16 16l5 5" />
            </svg>
          </button>
          <button type="button" id="menu-open" class="icon-button" aria-label="Más opciones" aria-haspopup="dialog">
            <svg class="icon icon-fill" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="5" cy="12" r="1.8" />
              <circle cx="12" cy="12" r="1.8" />
              <circle cx="19" cy="12" r="1.8" />
            </svg>
          </button>
        </div>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty" class="empty" hidden></p>

      <footer class="footer">
        <button id="clear-completed" type="button" class="link-button">
          Eliminar completadas
        </button>
        <button
          id="export"
          type="button"
          class="link-button"
          title="Descargar tus tareas como archivo JSON"
        >
          Exportar
        </button>
        <button
          id="import"
          type="button"
          class="link-button"
          title="Sumar tareas desde un archivo JSON exportado antes"
        >
          Importar
        </button>
        <input id="import-file" class="sr-only" type="file" accept=".json,application/json" tabindex="-1" aria-hidden="true" />
      </footer>

      <p class="hint">Doble clic en una tarea para editarla. Sumá #etiquetas dentro del texto para agruparlas.</p>
    </main>

    <dialog id="edit-sheet" class="sheet-dialog" aria-labelledby="edit-title">
      <form id="edit-form" class="sheet-form">
        <h2 id="edit-title">Editar tarea</h2>
        <label class="field">
          Tarea
          <input id="edit-text" type="text" maxlength="200" autocomplete="off" required />
        </label>
        <fieldset class="field">
          <legend>Vence</legend>
          <div class="seg" id="edit-due-chips">
            <button type="button" data-due="today">Hoy</button>
            <button type="button" data-due="tomorrow">Mañana</button>
            <button type="button" data-due="nextweek">+1 semana</button>
            <button type="button" data-due="">Sin fecha</button>
          </div>
          <input id="edit-due" type="date" aria-label="Fecha de vencimiento" />
        </fieldset>
        <fieldset class="field">
          <legend>Prioridad</legend>
          <div class="seg" id="edit-priority">
            <button type="button" data-priority="high">Alta</button>
            <button type="button" data-priority="medium">Media</button>
            <button type="button" data-priority="low">Baja</button>
          </div>
        </fieldset>
        <div class="sheet-actions">
          <button type="button" id="edit-delete" class="danger">Eliminar</button>
          <button type="button" id="edit-cancel" class="link-button">Cancelar</button>
          <button type="submit" class="primary-small">Guardar</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" hidden>
      <span id="toast-message"></span>
      <button id="toast-undo" type="button">Deshacer</button>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
