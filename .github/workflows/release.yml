name: Release

# Cuando llega a main una versión nueva en package.json que todavía no tiene
# Release, se crea el tag y el Release en GitHub con las notas de CHANGELOG.md.
# También se puede correr a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer la versión
        id: version
        run: echo "number=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Ver si ya existe el Release
        id: exists
        run: |
          if gh release view "v${{ steps.version.outputs.number }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extraer las notas de la versión
        if: steps.exists.outputs.found == 'false'
        run: |
          awk -v v="${{ steps.version.outputs.number }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            /^## \[/ { found = 0 }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No hay notas para la versión ${{ steps.version.outputs.number }} en CHANGELOG.md" >&2
            exit 1
          fi

      - name: Crear el tag y el Release
        if: steps.exists.outputs.found == 'false'
        run: |
          gh release create "v${{ steps.version.outputs.number }}" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.version.outputs.number }}" \
            --notes-file notes.md
